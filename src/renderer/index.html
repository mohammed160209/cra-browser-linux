<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cra Browser</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/sidebar.css">
  <link rel="stylesheet" href="styles/tabs.css">
  <link rel="stylesheet" href="styles/toolbar.css">
  <link rel="stylesheet" href="styles/command-bar.css">
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div id="app-container">
    <!-- Left Sidebar -->
    <aside class="cra-sidebar" id="sidebar">
      <!-- Sidebar Header -->
      <header class="sidebar-header">
        <div class="traffic-lights">
          <span class="light-dot close" id="btn-close-app" title="Close"></span>
          <span class="light-dot minimize" id="btn-minimize-app" title="Minimize"></span>
          <span class="light-dot maximize" id="btn-maximize-app" title="Maximize"></span>
        </div>
        <div class="sidebar-controls">
          <button class="icon-btn" id="btn-toggle-sidebar" title="Toggle Sidebar (Ctrl+S)">
            <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm2 2v14h4V5H5zm6 0v14h8V5h-8z"/></svg>
          </button>
          <button class="icon-btn" id="btn-new-tab" title="New Tab (Ctrl+T)">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
        </div>
      </header>

      <!-- Favorites Grid -->
      <section class="favorites-container">
        <div class="favorites-grid" id="favorites-grid">
          <!-- Dynamically populated favorite tiles -->
        </div>
      </section>

      <!-- Scrollable Tabs and Folders -->
      <div class="sidebar-scroll-area" id="sidebar-scroll-area">
        <!-- Pinned Section -->
        <section class="pinned-section">
          <div class="section-header">
            <span>Pinned</span>
            <div class="section-actions">
              <button class="section-action-btn" id="btn-new-folder" title="New Folder">+ Folder</button>
            </div>
          </div>
          <div class="tab-list" id="pinned-list">
            <!-- Pinned Tabs & Folders -->
          </div>
        </section>

        <div class="sidebar-separator"></div>

        <!-- Today Section -->
        <section class="today-section">
          <div class="section-header">
            <span>Today</span>
            <div class="section-actions">
              <button class="section-action-btn" id="btn-clear-today" title="Clear Today Tabs (Shift+Ctrl+K)">Clear</button>
            </div>
          </div>
          <div class="tab-list" id="today-list">
            <!-- Today Tabs -->
          </div>
        </section>
      </div>

      <!-- Resizer Handle -->
      <div class="sidebar-resizer" id="sidebar-resizer"></div>

      <!-- Space Dock at Bottom -->
      <footer class="space-dock" id="space-dock">
        <div class="space-dock-items" id="space-dock-items">
          <!-- Space Icon Buttons -->
        </div>
        <div class="space-dock-actions">
          <button class="icon-btn" id="btn-new-space" title="New Space">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <button class="icon-btn" id="btn-open-settings" title="Settings (Ctrl+,)">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </button>
        </div>
      </footer>
    </aside>

    <!-- Right Content Wrapper -->
    <main class="content-wrapper" id="content-wrapper">
      <div class="pane-card" id="pane-card">
        <!-- Top Toolbar -->
        <nav class="pane-toolbar" id="pane-toolbar">
          <div class="nav-group">
            <button class="nav-btn" id="btn-history-back" title="Back (Alt+Left)">
              <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <button class="nav-btn" id="btn-history-forward" title="Forward (Alt+Right)">
              <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </button>
            <button class="nav-btn" id="btn-reload" title="Reload (Ctrl+R)">
              <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
          </div>

          <!-- URL Pill / Omnibox -->
          <div class="url-pill" id="url-pill" title="Click to search or enter URL (Ctrl+L)">
            <svg class="url-lock-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <span class="url-text" id="url-text">Search or enter URL...</span>
            <span class="url-badge">⌘L</span>
          </div>

          <!-- Toolbar Right Actions -->
          <div class="toolbar-actions">
            <button class="nav-btn" id="btn-toggle-mute" title="Mute/Unmute Tab" style="display: none;">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <button class="nav-btn" id="btn-toggle-split" title="Split View Orientation">
              <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm8 16V5H5v14h6zm8 0V5h-6v14h6z"/></svg>
            </button>
            <button class="nav-btn" id="btn-unsplit" title="Close Split View" style="display: none;">
              <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </nav>

        <!-- Placeholder when no tab is selected -->
        <div class="tab-placeholder" id="tab-placeholder" style="display: none;">
          <div class="placeholder-search-box" id="placeholder-search-trigger">
            <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Search or Enter URL…</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Floating Command Bar Modal -->
    <div class="modal-overlay" id="command-bar-overlay">
      <div class="command-bar-card" id="command-bar-card">
        <div class="command-input-row">
          <span class="command-scope-badge" id="command-scope-badge">TABS</span>
          <input type="text" class="command-input" id="command-input" placeholder="Search or Enter URL…" autocomplete="off" spellcheck="false">
        </div>
        <div class="command-suggestions-list" id="command-suggestions-list">
          <!-- Suggestion rows -->
        </div>
        <div class="command-bar-footer">
          <div>
            <span>Press <span class="keycap">↵</span> to open</span>
            <span style="margin-left: 10px;">Press <span class="keycap">Tab</span> for commands</span>
          </div>
          <div>
            <span><span class="keycap">Esc</span> to close</span>
          </div>
        </div>
      </div>
    </div>

    <!-- macOS Settings Modal (778x509) -->
    <div class="settings-overlay" id="settings-overlay">
      <div class="settings-window">
        <!-- 204px Left Nav Rail -->
        <nav class="settings-sidebar">
          <div class="settings-window-header">
            <div class="traffic-lights">
              <span class="light-dot close" id="btn-close-settings" title="Close Settings"></span>
            </div>
          </div>
          <div class="settings-sidebar-nav">
            <div class="settings-nav-item active" data-pane="general">
              <span class="settings-nav-glyph"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span>
              <span>General</span>
            </div>
            <div class="settings-nav-item" data-pane="tabs">
              <span class="settings-nav-glyph"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm2 2v14h14V5H5z"/></svg></span>
              <span>Tabs</span>
            </div>
            <div class="settings-nav-item" data-pane="privacy">
              <span class="settings-nav-glyph"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg></span>
              <span>Privacy</span>
            </div>
            <div class="settings-nav-item" data-pane="shortcuts">
              <span class="settings-nav-glyph"><svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg></span>
              <span>Shortcuts</span>
            </div>
            <div class="settings-nav-item" data-pane="performance">
              <span class="settings-nav-glyph"><svg viewBox="0 0 24 24"><path d="M12 4C7.03 4 3 8.03 3 13s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm1 14h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 .88-.36 1.68-.93 2.25z"/></svg></span>
              <span>Performance</span>
            </div>
            <div class="settings-nav-item" data-pane="advanced">
              <span class="settings-nav-glyph"><svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0 0 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg></span>
              <span>Advanced</span>
            </div>
          </div>
        </nav>

        <!-- Right Content Body -->
        <section class="settings-content-container">
          <header class="settings-toolbar">
            <span class="settings-pane-title" id="settings-current-pane-title">General</span>
          </header>
          <div class="settings-scroll-body" id="settings-pane-content">
            <!-- Dynamic pane components will be rendered here -->
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
