name: Linux Chromium build

on:
  push:
    branches: [chromium-cef-linux]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libx11-dev libgtk-3-0t64 xvfb xauth
      - name: Fetch the pinned CEF binary
        shell: bash
        run: |
          source PKGBUILD
          curl --fail --location --retry 3 "${source[1]}" -o cef.tar.bz2
          printf '%s  cef.tar.bz2\n' "${sha256sums[1]}" | sha256sum -c -
          mkdir cef
          tar -xf cef.tar.bz2 -C cef --strip-components=1
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCEF_ROOT="$PWD/cef" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$PWD/stage"
      - name: Launch Chromium with a local fixture
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          # The hosted runner restricts Chromium user namespaces. The fixture is local.
          xvfb-run -a timeout 60 ./stage/lib/cra-browser-cef/cra-browser \
            --no-sandbox --disable-gpu --disable-background-networking \
            --disable-component-update --cra-smoke-test
